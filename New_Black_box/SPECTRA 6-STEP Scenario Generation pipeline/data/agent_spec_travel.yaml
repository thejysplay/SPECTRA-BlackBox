- name: create_calendar_event
  description: Creates a new calendar event with the given details and adds it to the calendar.
  full_docstring: 'Creates a new calendar event with the given details and adds it to the calendar.

    It also sends an email to the participants with the event details.'
  parameters_json_schema:
    properties:
      title:
        description: The title of the event.
        title: Title
        type: string
      start_time:
        description: The start time of the event. Must be in format YYYY-MM-DD HH:MM.
        title: Start Time
        type: string
      end_time:
        description: The end time of the event. Must be in format YYYY-MM-DD HH:MM.
        title: End Time
        type: string
      description:
        default: ''
        description: The description of the event.
        title: Description
        type: string
      participants:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: The list of participants' email addresses. If `null`, no participants are set. The calendar owner's email address is always included..
        title: Participants
      location:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The location of the event. If `null`, no location is set.
        title: Location
    required:
    - title
    - start_time
    - end_time
- name: search_calendar_events
  description: Searches calendar events that match the given query in the tile or the description. If provided, filters events by date.
  full_docstring: Searches calendar events that match the given query in the tile or the description. If provided, filters events by date.
  parameters_json_schema:
    properties:
      query:
        description: The query string to search for in event titles and descriptions.
        title: Query
        type: string
      date:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The date for which to search events. Must be in format YYYY-MM-DD. If `null`, searches all events.
        title: Date
    required:
    - query
- name: get_day_calendar_events
  description: Returns the appointments for the given `day`. Returns a list of dictionaries with informations about each meeting.
  full_docstring: Returns the appointments for the given `day`. Returns a list of dictionaries with informations about each meeting.
  parameters_json_schema:
    properties:
      day:
        description: The day for which to return the appointments. Must be in format YYYY-MM-DD.
        title: Day
        type: string
    required:
    - day
- name: cancel_calendar_event
  description: Cancels the event with the given `event_id`. The event will be marked as canceled and no longer appear in the calendar.
  full_docstring: 'Cancels the event with the given `event_id`. The event will be marked as canceled and no longer appear in the calendar.

    It will also send an email to the participants notifying them of the cancellation.'
  parameters_json_schema:
    properties:
      event_id:
        description: The ID of the event to cancel.
        title: Event Id
        type: string
    required:
    - event_id
- name: reserve_hotel
  description: Makes a reservation for a hotel with the provided details..
  full_docstring: Makes a reservation for a hotel with the provided details..
  parameters_json_schema:
    properties:
      hotel:
        description: Where the reservation is made. It must only be the name of the hotel.
        title: Hotel
        type: string
      start_day:
        description: The check-in day for the hotel. Should be in ISO format 'YYYY-MM-DD'.
        title: Start Day
        type: string
      end_day:
        description: The check-out day for the hotel. Should be in ISO format 'YYYY-MM-DD'.
        title: End Day
        type: string
    required:
    - hotel
    - start_day
    - end_day
- name: reserve_car_rental
  description: Makes a reservation for a car rental with the provided details.
  full_docstring: Makes a reservation for a car rental with the provided details.
  parameters_json_schema:
    properties:
      company:
        description: Where the reservation is made. It must only be the name of the car rental company.
        title: Company
        type: string
      start_time:
        description: The reservation starting time. Should be in ISO format 'YYYY-MM-DD HH:MM'.
        title: Start Time
        type: string
      end_time:
        anyOf:
        - type: string
        - type: 'null'
        description: The reservation end time. Should be in ISO format 'YYYY-MM-DD HH:MM'.
        title: End Time
    required:
    - company
    - start_time
    - end_time
- name: reserve_restaurant
  description: Makes a reservation for a restaurant with the provided details.
  full_docstring: Makes a reservation for a restaurant with the provided details.
  parameters_json_schema:
    properties:
      restaurant:
        description: Where the reservation is made. It must only be the name of the restaurant.
        title: Restaurant
        type: string
      start_time:
        description: 'The reservation time. Should be in ISO format ''YYYY-MM-DD HH:MM''.

          The end time is automatically set to be two hours after the start of the reservation.'
        title: Start Time
        type: string
    required:
    - restaurant
    - start_time
- name: get_flight_information
  description: Get the flight information from the departure city to the arrival city.
  full_docstring: Get the flight information from the departure city to the arrival city.
  parameters_json_schema:
    properties:
      departure_city:
        description: The city to depart from.
        title: Departure City
        type: string
      arrival_city:
        description: The city to arrive at.
        title: Arrival City
        type: string
    required:
    - departure_city
    - arrival_city
- name: send_email
  description: Sends an email with the given `body` to the given `address`. Returns a dictionary with the email details.
  full_docstring: Sends an email with the given `body` to the given `address`. Returns a dictionary with the email details.
  parameters_json_schema:
    properties:
      recipients:
        description: The list with the email addresses of the recipients.
        items:
          type: string
        title: Recipients
        type: array
      subject:
        description: The subject of the email.
        title: Subject
        type: string
      body:
        description: The body of the email.
        title: Body
        type: string
      attachments:
        anyOf:
        - items:
            additionalProperties: true
            type: object
          type: array
        - type: 'null'
        default: null
        description: 'The list of attachments to include in the email. If `null`, no attachments are included.

          If the attachment has as "type" "file", then it is expected to have a field "file_id", with the ID of the file in the

          cloud drive. If the attachment has as "type" "event", then it is expected to be a calendar event in the field "event_details".

          A calendar event has the following fields: `title`, `description`, `start_time` (in ISO format), `end_time`

          (in ISO format), `location`, and participants (a list of emails).'
        title: Attachments
      cc:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: The list of email addresses to include in the CC field. If `null`, no email addresses are included.
        title: Cc
      bcc:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: The list of email addresses to include in the BCC field. If `null`, no email addresses are included.
        title: Bcc
    required:
    - recipients
    - subject
    - body
