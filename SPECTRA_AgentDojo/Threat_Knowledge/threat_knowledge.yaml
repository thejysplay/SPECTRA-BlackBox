# ============================================================================
# SPECTRA Threat Knowledge  (자동생성: _generate.py · 직접 편집 금지)
# THREAT_MATRIX: E1~E10 / 24 Subcategory / 136 Instance {name_ko,name_en,description,example}
# CASE_STUDIES : 31 ATLAS CS   ·   ATTACK_GOALS: G1~G9
# ============================================================================
THREAT_MATRIX:
  E1:
    name_ko: 진입
    name_en: Entry
    description: Direct + Indirect 모든 입력 수단
    subcategories:
      ENT-DI:
        name_ko: 직접 입력
        name_en: Direct Input
        description: 공격자가 Agent 의 직접 입력 인터페이스를 통해 지시 또는 콘텐츠를 전달
        instances:
          ENT-DI.CHAT:
            name_ko: Chat / 화면 입력
            name_en: Chat / UI Input
            description: 사용자가 Agent 의 Chat·UI 화면을 통해 직접 입력하는 콘텐츠
            example: Chat 창에 직접 Prompt 입력
          ENT-DI.CLI:
            name_ko: CLI / Terminal 입력
            name_en: CLI / Terminal Input
            description: CLI·Terminal 인터페이스를 통해 Agent 에 직접 전달되는 입력
            example: CLI argument 로 Agent 작업 요청
          ENT-DI.API:
            name_ko: API 입력
            name_en: API / Agent Endpoint Input
            description: Agent API 또는 Endpoint 요청을 통해 직접 전달되는 입력
            example: API request body 에 작업 지시 포함
      ENT-II:
        name_ko: 간접 입력
        name_en: Indirect Input
        description: 이메일·파일·웹사이트 등 외부 콘텐츠가 Agent 의 작업 과정에서 간접적으로 Context 에 유입
        instances:
          ENT-II.EMAIL:
            name_ko: Email / 메일
            name_en: Email
            description: Agent 가 조회·처리하는 외부 Email 콘텐츠
            example: Email 본문을 Agent 가 읽음
          ENT-II.FILE:
            name_ko: File / 문서
            name_en: File / Document
            description: Agent 가 읽거나 처리하는 외부 File·Document 콘텐츠
            example: read_file 로 문서 내용 조회
          ENT-II.WEB_URL:
            name_ko: Web / URL
            name_en: Web / URL
            description: Agent 가 접근하여 읽는 외부 Web page 또는 URL 콘텐츠
            example: Browser 로 Web page 내용 확인
          ENT-II.MESSAGE_SNS:
            name_ko: Message / SNS
            name_en: Message / SNS
            description: Messenger·SNS·협업 서비스에 존재하는 외부 메시지 콘텐츠
            example: Slack·Teams 메시지 조회
          ENT-II.CALENDAR_EVENT:
            name_ko: Calendar / Event
            name_en: Calendar / Event
            description: Calendar 일정의 제목·본문·설명 등에 포함된 콘텐츠
            example: 일정 description 조회
          ENT-II.RETRIEVED_CONTENT:
            name_ko: 검색 / 검색 콘텐츠
            name_en: Search / Retrieved Content
            description: Search·Retrieval·RAG 를 통해 가져온 콘텐츠
            example: 검색 결과 문서를 Agent 가 읽음
          ENT-II.WORK_ITEM:
            name_ko: 업무 항목 / 협업 콘텐츠
            name_en: Work Item / Collaboration Content
            description: Issue·Ticket·PR·Task 등 업무 객체에 저장된 콘텐츠
            example: PR description 또는 Ticket 본문 조회
          ENT-II.APPLICATION_RECORD:
            name_ko: 애플리케이션 / 서비스 레코드
            name_en: Application / Service Record
            description: 연결된 업무 App·서비스에 저장되어 Agent 가 조회하는 Record 형태의 콘텐츠
            example: 거래내역·예약정보·고객 Record 조회
  E2:
    name_ko: 편입
    name_en: Integration
    description: Agent 기능 범위 내에 외부 도구·설정·모델 등의 구성요소가 받아들여짐
    subcategories:
      INT-EC:
        name_ko: 실행형 구성요소
        name_en: Executable Component
        description: Agent 가 실제 기능으로 사용할 수 있는 실행형 구성요소
        instances:
          INT-EC.TOOL_PLUGIN:
            name_ko: Tool / Plugin
            name_en: Tool / Plugin
            description: Agent 가 직접 호출할 수 있도록 등록되는 실행형 Tool·Plugin
            example: 외부 Plugin 등록
          INT-EC.SKILL_FUNCTION:
            name_ko: Skill / Function
            name_en: Skill / Function
            description: 특정 작업을 수행하도록 Agent 에 추가되는 Skill·Function
            example: 새로운 Skill 추가
          INT-EC.MCP_REMOTE_TOOL:
            name_ko: MCP / Remote Tool
            name_en: MCP / Remote Tool
            description: MCP Server 또는 Remote Function 을 통해 제공되는 실행 기능
            example: MCP Server 연결
          INT-EC.PACKAGE_LIBRARY:
            name_ko: Package / Library
            name_en: Package / Library
            description: Agent 실행환경에 포함되어 기능 수행에 사용되는 코드 의존성
            example: 외부 Library 설치
          INT-EC.EXTENSION_ADDON:
            name_ko: Extension / Add-on
            name_en: Extension / Add-on
            description: 기존 Agent 기능에 추가되는 확장 구성요소
            example: Browser/Agent Extension 설치
      INT-CR:
        name_ko: 설정·규칙
        name_en: Config·Rule
        description: Agent 또는 Tool 의 동작 방식·조건·절차를 정하는 구성정보
        instances:
          INT-CR.SYSTEM_INSTRUCTION:
            name_ko: System Instruction / Prompt
            name_en: System Instruction / Prompt
            description: Agent 의 기본 역할과 행동 방향을 지정하는 상위 Instruction
            example: System Prompt 설정
          INT-CR.POLICY_GUARDRAIL:
            name_ko: Policy / Guardrail 설정
            name_en: Policy / Guardrail Configuration
            description: 허용·제한·승인 조건 등 Agent 의 정책적 동작을 정하는 설정
            example: 민감작업 승인 정책
          INT-CR.CONFIGURATION:
            name_ko: Configuration / Setting
            name_en: Configuration / Setting
            description: Agent 또는 Tool 의 동작값과 기능 설정을 지정하는 구성정보
            example: Endpoint·Mode 설정
          INT-CR.INSTRUCTION_FILE:
            name_ko: Instruction File
            name_en: Instruction File
            description: Agent 가 작업 과정에서 참고하는 별도의 지시 파일
            example: AGENTS.md 등
          INT-CR.WORKFLOW_PROCEDURE:
            name_ko: Workflow / Procedure 정의
            name_en: Workflow / Procedure Definition
            description: Agent 가 수행할 작업의 단계와 절차를 정의하는 구성
            example: 승인→실행 Workflow
      INT-MT:
        name_ko: 모델·템플릿
        name_en: Model·Template
        description: Agent 의 판단·생성에 사용되는 Model 및 Model 수준 구성요소
        instances:
          INT-MT.MODEL_CHECKPOINT:
            name_ko: Model / Checkpoint
            name_en: Model / Checkpoint
            description: Agent 가 추론·생성에 사용하는 Model 또는 Checkpoint
            example: 특정 LLM checkpoint 사용
          INT-MT.CHAT_TEMPLATE:
            name_ko: Model Chat Template
            name_en: Model Chat Template
            description: Model 에 전달되는 대화 구조와 형식을 지정하는 Template
            example: Model 별 Chat Template
          INT-MT.EMBEDDING_INDEX:
            name_ko: Embedding / Index
            name_en: Embedding / Index
            description: 검색·표현·유사도 계산 등에 사용되는 Embedding 또는 Index
            example: Vector Index 사용
          INT-MT.ADAPTER_LORA:
            name_ko: Adapter / LoRA
            name_en: Adapter / LoRA
            description: 기본 Model 에 추가로 결합되어 Model 동작에 영향을 주는 구성요소
            example: LoRA Adapter 적용
  E3:
    name_ko: 인지 조작
    name_en: Cognition Manipulation
    description: 외부 영향으로 Agent 의 판단·계획 또는 생성 결과가 원래 의도와 다르게 변경
    subcategories:
      CM-AM:
        name_ko: 행동 조작
        name_en: Action Manipulation
        description: Agent 가 무엇을 하고 어떻게 행동할지에 대한 판단·Planning 이 변경
        instances:
          CM-AM.GOAL_PLAN:
            name_ko: 목표 / 계획
            name_en: Goal / Plan
            description: Agent 가 수행하려는 목표 또는 작업 계획
            example: 조회 작업이 다른 작업 수행 계획으로 변경
          CM-AM.TOOL_SELECTION:
            name_ko: Tool 선택
            name_en: Tool Selection
            description: 작업 수행에 사용할 Tool 을 선택하는 판단
            example: 조회 Tool 대신 송금 Tool 선택
          CM-AM.TOOL_ARGUMENT:
            name_ko: Tool 입력값
            name_en: Tool Argument
            description: Tool 호출에 전달되는 입력값·Parameter
            example: recipient, amount 값 변경
          CM-AM.ACTION_ORDER:
            name_ko: 작업 순서
            name_en: Action Order
            description: 복수 행동 또는 Tool 호출의 수행 순서
            example: 확인 전에 실행부터 수행
      CM-GM:
        name_ko: 생성 조작
        name_en: Generation Manipulation
        description: Agent 가 생성하는 Content·Code·Prompt·File 등의 결과가 변경
        instances:
          CM-GM.RESPONSE_CONTENT:
            name_ko: 생성 Response / Content
            name_en: Generated Response / Content
            description: Agent 가 생성하는 텍스트·정보·콘텐츠
            example: 잘못된 설명 또는 정보 생성
          CM-GM.CODE_SCRIPT:
            name_ko: 생성 Code / Script
            name_en: Generated Code / Script
            description: Agent 가 작성하는 프로그램 Code·Script
            example: Python Script 생성
          CM-GM.PROMPT_INSTRUCTION:
            name_ko: 생성 Prompt / Instruction
            name_en: Generated Prompt / Instruction
            description: Agent 가 다른 Agent·Model 등에 전달하기 위해 생성하는 Prompt·Instruction
            example: 후속 Agent 용 Prompt 생성
          CM-GM.FILE_DOCUMENT:
            name_ko: 생성 File / Document
            name_en: Generated File / Document
            description: Agent 가 결과물로 생성하는 File·문서
            example: 보고서·문서 File 생성
  E4:
    name_ko: 권한·권위
    name_en: Privilege/Authority
    description: Agent 에게 부여된 권한의 사용, Credential 을 통한 접근, 또는 접근통제의 우회
    subcategories:
      PA-GA:
        name_ko: 부여 권한
        name_en: Granted Authority
        description: Agent 에게 이미 부여되거나 위임된 권한으로 기능·자원에 접근
        instances:
          PA-GA.USER_AUTHORITY:
            name_ko: 사용자 위임 권한
            name_en: User-delegated Authority
            description: 사용자가 Agent 에 위임한 작업·자원 접근 권한
            example: 사용자 Calendar 수정 권한
          PA-GA.SERVICE_APP_AUTHORITY:
            name_ko: Service / App 권한
            name_en: Service / App Authority
            description: Service·App·Connector 자체에 부여된 권한
            example: Slack App scope
          PA-GA.ADMIN_ELEVATED_AUTHORITY:
            name_ko: 관리자 / 상위 권한
            name_en: Admin / Elevated Authority
            description: 일반 사용자보다 높은 관리·특수 작업 권한
            example: Admin 기능 사용
      PA-CT:
        name_ko: 자격증명·토큰 사용
        name_en: Credential·Token Use
        description: 인증에 사용되는 Credential·Token 을 이용해 시스템·서비스에 접근
        instances:
          PA-CT.ACCESS_OAUTH_TOKEN:
            name_ko: Access / OAuth Token
            name_en: Access / OAuth Token
            description: API·서비스 접근에 사용하는 Access·OAuth·Refresh Token
            example: OAuth Token 사용
          PA-CT.API_SECRET_KEY:
            name_ko: API / Secret Key
            name_en: API / Secret Key
            description: API 또는 Service 인증에 사용되는 Key·Secret
            example: API Key
          PA-CT.PASSWORD_CREDENTIAL:
            name_ko: Password / Credential
            name_en: Password / Credential
            description: Password 기반 계정 인증정보
            example: 사용자 Password
          PA-CT.SESSION_COOKIE:
            name_ko: Session / Cookie
            name_en: Session / Cookie
            description: 기존 인증상태를 유지·재사용하는 Session 정보
            example: 로그인 Cookie
          PA-CT.CERT_PRIVATE_KEY:
            name_ko: Certificate / Private Key
            name_en: Certificate / Private Key
            description: Certificate·Private Key 기반 인증정보
            example: Client Certificate
      PA-ACB:
        name_ko: 접근통제 우회
        name_en: Access-Control Bypass
        description: 정상적으로 적용되어야 하는 인증·권한·접근·승인 통제를 거치지 않고 기능이나 자원에 접근
        instances:
          PA-ACB.AUTHENTICATION_CONTROL:
            name_ko: 인증 통제
            name_en: Authentication Control
            description: 사용자·Service 의 신원을 확인하는 통제 지점
            example: Login/Auth 단계
          PA-ACB.AUTHORIZATION_SCOPE_CONTROL:
            name_ko: 권한 / Scope 통제
            name_en: Authorization / Scope Control
            description: 허용된 작업·자원 범위를 확인하는 통제
            example: Permission·OAuth Scope
          PA-ACB.OBJECT_ACCESS_CONTROL:
            name_ko: 객체 단위 접근통제
            name_en: Object-level Access Control
            description: 특정 Resource 의 소유·접근 가능 여부를 확인하는 통제
            example: 다른 사용자 Resource 접근 제한
          PA-ACB.APPROVAL_GATE:
            name_ko: 승인 단계
            name_en: Approval Gate
            description: 민감 작업 수행 전에 필요한 사람·시스템 승인 단계
            example: 송금 전 confirmation
  E5:
    name_ko: 데이터 확보
    name_en: Data Exfiltration
    description: 공격자가 목표로 하는 민감 데이터에 접근하여 정보를 확보
    subcategories:
      DEX-UBD:
        name_ko: 사용자·업무 데이터
        name_en: User·Business Data
        description: 사용자·조직·업무 활동과 관련된 데이터
        instances:
          DEX-UBD.CUSTOMER_CRM:
            name_ko: 고객 / CRM 데이터
            name_en: Customer / CRM Data
            description: 고객·영업·CRM 관련 정보
            example: 고객 이름·고객번호
          DEX-UBD.COMMUNICATION_CONTENT:
            name_ko: 커뮤니케이션 내용
            name_en: Communication Content
            description: Email·Message·Chat 등 사람 간 커뮤니케이션 내용
            example: Email 본문·Slack 메시지
          DEX-UBD.WORK_DOCUMENT:
            name_ko: 업무 문서
            name_en: Work Document
            description: 조직 업무 과정에서 생성·사용되는 File·Document
            example: 내부 보고서
          DEX-UBD.CALENDAR_SCHEDULE:
            name_ko: Calendar / 일정 데이터
            name_en: Calendar / Schedule Data
            description: 일정·Meeting·참석자·시간 관련 정보
            example: 임원 일정
          DEX-UBD.CONTACT_PROFILE:
            name_ko: Contact / Profile 데이터
            name_en: Contact / Profile Data
            description: 연락처·사용자 Profile·개인 기본정보
            example: 이름·주소·전화번호
          DEX-UBD.ACCOUNT_PAYMENT:
            name_ko: Account / Payment 데이터
            name_en: Account / Payment Data
            description: 계좌·결제수단·잔액 등 금융계정 관련 정보
            example: IBAN·잔액
          DEX-UBD.TRANSACTION:
            name_ko: 거래 데이터
            name_en: Transaction Data
            description: 송금·결제·거래 내역
            example: 최근 송금 내역
          DEX-UBD.ORDER_RESERVATION:
            name_ko: 주문 / 예약 데이터
            name_en: Order / Reservation Data
            description: 상품·서비스의 주문·예약 관련 정보
            example: 호텔·항공 예약
          DEX-UBD.PROJECT_WORK_ITEM:
            name_ko: Project / 업무항목 데이터
            name_en: Project / Work-item Data
            description: Project·Issue·Ticket·Task 등 업무관리 정보
            example: Jira Ticket
      DEX-CS:
        name_ko: 자격증명·비밀
        name_en: Credential·Secret
        description: 시스템·서비스 접근에 사용되는 인증정보 및 Secret
        instances:
          DEX-CS.TOKEN_SESSION:
            name_ko: Token / Session Credential
            name_en: Token / Session Credential
            description: Access Token·Session·Cookie 등 인증상태 정보
            example: 로그인 Token
          DEX-CS.API_SECRET_KEY:
            name_ko: API / Secret Key
            name_en: API / Secret Key
            description: API·Service 에서 사용하는 Key·Secret
            example: API Key
          DEX-CS.PASSWORD_CREDENTIAL:
            name_ko: Password / Credential
            name_en: Password / Credential
            description: 사용자 또는 서비스의 Password 기반 Credential
            example: 로그인 Password
          DEX-CS.PRIVATE_KEY_CERT:
            name_ko: Private Key / Certificate
            name_en: Private Key / Certificate
            description: 인증·암호화에 사용되는 Private Key·Certificate
            example: SSH Private Key
      DEX-SRD:
        name_ko: 시스템·런타임 데이터
        name_en: System·Runtime Data
        description: Agent 또는 시스템의 실행환경에서 발생·저장되는 내부 정보
        instances:
          DEX-SRD.SYSTEM_CONFIG_FILE:
            name_ko: System / Configuration File
            name_en: System / Configuration File
            description: 시스템·Application 동작을 위한 File·Configuration
            example: config.yaml
          DEX-SRD.ENVIRONMENT_VARIABLE:
            name_ko: 환경변수
            name_en: Environment Variable
            description: Process 실행환경에 설정된 환경변수
            example: API_KEY 환경변수
          DEX-SRD.MEMORY_PROCESS:
            name_ko: Memory / Process 데이터
            name_en: Memory / Process Data
            description: 실행 중인 Process·Memory 와 관련된 정보
            example: Process Memory
          DEX-SRD.LOG:
            name_ko: Log
            name_en: Log
            description: 시스템·Application·Agent 가 기록한 실행 Log
            example: Access Log
          DEX-SRD.CLIPBOARD:
            name_ko: Clipboard
            name_en: Clipboard
            description: 사용자·시스템 Clipboard 에 임시 저장된 내용
            example: 복사된 Password
          DEX-SRD.SOURCE_REPOSITORY:
            name_ko: Source Code / Repository
            name_en: Source Code / Repository
            description: 프로그램 Source Code 와 Repository 내용
            example: 내부 Git Repository
          DEX-SRD.BROWSER_LOCAL_SESSION:
            name_ko: Browser / Local Session 데이터
            name_en: Browser / Local Session Data
            description: Browser History·Local Storage·Browser Session 등의 정보
            example: Local Storage Token
  E6:
    name_ko: 호출
    name_en: Invocation
